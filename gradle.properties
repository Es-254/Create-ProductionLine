# Direct connections (verified reachable from this machine; large jars are more stable direct):
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.createmod.net|*.blamejared.com|*.aliyun.com|*.littleservice.cn|*.parchmentmc.org
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.createmod.net|*.blamejared.com|*.aliyun.com|*.littleservice.cn|*.parchmentmc.org
# Java TLS 信任库（由 Windows 根证书构建，供本机 gradle 校验服务器证书）
systemProp.javax.net.ssl.trustStore=C:/Users/YUNLI/Desktop/CREATE_PRODUCTION/nettest/winroots.jks
systemProp.javax.net.ssl.trustStorePassword=changeit

#read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
# 版本策略（换 NeoForge 小版本只需改这里三处，其余自动跟随）：
#   neo_version            = NeoForge 构建号（运行时要求 >= 此值，见下方依赖范围）
#   minecraft_version_range= 形如 [1.21.1]，锁定大版本
#   loader_version_range   = FML loader 主版本跨度（NeoForge 21.1 为 [1,)）
# 若 API 有差异需同步 build.gradle/源码；改动后建议删 run/ 或先 clean 再 build。
# ---------------------------------------------------------------------------
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.249
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=create_productionline
# The human-readable display name for the mod.
mod_name=Create: Production Line
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.0
# Author / publisher shown in-game and on the mod platforms.
mod_authors=Es254
mod_credits=Built with NeoForge & Create
# Public links (Modrinth "source"/homepage, in-game displayURL).
# GitHub is not available yet, so the Modrinth project page is the public home for now.
mod_display_url=https://modrinth.com/project/createproductionline
# TODO(later): set once a public repository / issue tracker exists, then re-add
# issueTrackerURL in src/main/resources/META-INF/neoforge.mods.toml.
mod_issue_tracker_url=
# Platform project ids/slugs, consumed by the publish tasks (see RELEASING.md).
# Modrinth accepts either the base62 project id or the slug; the slug is used here
# because it is stable and visible in the project URL:
#   https://modrinth.com/project/createproductionline/
modrinth_project_id=createproductionline
# TODO(release): numeric CurseForge project id (Authors dashboard → project → About).
curseforge_project_id=
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.create.productionline

