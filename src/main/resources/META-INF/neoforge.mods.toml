# Create: Production Line — neoforge.mods.toml
# A Create addon that turns a target item into an ordered line of Create machines with native recipe JSON.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"
logoFile="create_productionline_icon.png"
credits="${mod_credits}"
displayURL="${mod_display_url}"
# The public repository exists (github.com/Es-254/Create-ProductionLine); the URL is
# expanded from gradle.properties' mod_issue_tracker_url, so the mod list UI links
# straight to the issue tracker.
issueTrackerURL="${mod_issue_tracker_url}"
# Client and server builds of this mod may legitimately differ during local
# testing; do not spam a version-mismatch warning for them.
displayTest="IGNORE_SERVER_VERSION"
description='''
Create: Production Line (机械动力：产业线)

An addon for the Create mod that turns a target item into an ordered production
line of Create machines, driven by native Create recipes.

Prerequisites: NeoForge for Minecraft 1.21.1 and Create 6.0.10+ are REQUIRED
(the mod refuses to start without them). JEI is OPTIONAL and only serves as a
recipe viewer — this mod does not call JEI APIs.

HOW IT WORKS
1. Put the item you want to produce in the Production Computer's left slot, and
   paper / a clipboard / a blank Line Scheme in the middle and right slots.
   Press [Compute]. The computer resolves the recipe, writes an ordered
   production-line plan plus a generated native Create recipe JSON onto the
   carrier, and fails loudly ("cannot map") instead of inventing a plan.
2. Insert the written Line Scheme into the 16-slot Scheme Loader: the recipes it
   needs are re-derived server-side and installed into the world datapack
   (cpl_converted), then reloaded. Several loaders and several schemes are
   combined (union), so multi-stage lines work. A redstone signal is emitted
   while recipes are active.
3. Build the line as the plan describes. Assembly recipes become Create's
   Sequenced Assembly: the base material goes onto a belt first, then one
   Deployer per extra material.
4. The Dismantler reverts a Generic Intermediate or a finished product back into
   its raw materials and leaves a read-only Line Scheme Mirror.

Blocks: Production Computer, Scheme Loader, Dismantler.
Items: Line Scheme, Line Scheme Mirror, Generic Intermediate.

Multiplayer-safe by design: schemes and mirrors are never trusted — the loader
re-derives every recipe from the live server recipe manager, and the dismantler
only refunds what the server can verify (anti-injection).
'''

# Dependencies
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,7.0.0)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,20.0.0)"
    ordering="NONE"
    side="BOTH"
    reason="This mod no longer calls JEI APIs; JEI is optional and only serves as a recipe viewer for players."

[[mixins]]
config="${mod_id}.mixins.json"
