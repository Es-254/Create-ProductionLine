plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    // Publication to the mod platforms. Declared but NOT applied by default, so a plain
    // `gradlew build` (and CI) never depends on them. Enable with: gradlew -PpublishMods …
    id 'com.modrinth.minotaur' version '2.9.0' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.25' apply false
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// -----------------------------------------------------------------------------
// Version resolution (see RELEASING.md → "Version policy")
//
//   gradlew build               -> 1.0.1          (release, type `release`)
//   gradlew build -PdevBuild    -> 0.0.0-dev.N    (dev, type `beta`)
//
// `mod_version` in gradle.properties is the RELEASE version. Dev builds take N
// from dev-build.txt and advance that file after the jar is written, so every dev
// artifact gets a distinct number; commit the bumped file with the dev build.
// CI reproduces a tagged dev build with -PdevBuildNumber=<N> (the file is left
// untouched in that mode).
// -----------------------------------------------------------------------------
def devNumberOverride = project.findProperty('devBuildNumber')?.toString()?.trim()
if (devNumberOverride != null && devNumberOverride.isEmpty()) {
    throw new GradleException('-PdevBuildNumber needs a number, e.g. -PdevBuildNumber=5.')
}
if (devNumberOverride != null && !(devNumberOverride ==~ /\d+/)) {
    throw new GradleException("-PdevBuildNumber must be a number, found '${devNumberOverride}'.")
}
def devBuild = project.hasProperty('devBuild') || devNumberOverride != null
def devCounterFile = file('dev-build.txt')
def devCounter = devNumberOverride
if (devBuild && devCounter == null) {
    // Only a dev build reads the counter, so a release build never depends on the file.
    if (!devCounterFile.exists()) {
        throw new GradleException('dev-build.txt is missing - it holds the next dev number (RELEASING.md -> Version policy).')
    }
    devCounter = devCounterFile.text.trim()
    if (!(devCounter ==~ /\d+/)) {
        throw new GradleException("dev-build.txt must hold a single number, found '${devCounter}'.")
    }
}
version = devBuild ? "0.0.0-dev.${devCounter}" : mod_version
// A release is any x.y.z; a dev build is always 0.0.0-dev.N (never a dev suffix on a release).
if (!(version ==~ /\d+\.\d+\.\d+/) && !(version ==~ /0\.0\.0-dev\.\d+/)) {
    throw new GradleException("Unsupported version '${version}': releases are x.y.z, dev builds 0.0.0-dev.N.")
}
group = mod_group_id

if (devBuild && devNumberOverride == null) {
    // Finalizer instead of jar.doLast: the counter must advance even when the jar task is
    // UP-TO-DATE or restored FROM-CACHE, otherwise two dev builds could share one number.
    // It only fires when this build actually produced the artifact.
    tasks.register('bumpDevCounter') {
        group = 'build'
        description = 'Advances dev-build.txt so the next dev build gets a fresh number.'
        outputs.upToDateWhen { false }
        doLast {
            def jarFile = tasks.named('jar').get().archiveFile.get().asFile
            if (!jarFile.exists()) {
                throw new GradleException("No artifact at ${jarFile} - not advancing dev-build.txt.")
            }
            def next = (devCounter as int) + 1
            devCounterFile.text = next.toString() + '\n'   // LF, like the committed file
            logger.lifecycle("Dev build ${project.version} written — next dev build is 0.0.0-dev.${next}.")
        }
    }
    tasks.named('jar').configure { finalizedBy 'bumpDevCounter' }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs.
    // (Keep the shipped jar free of editor leftovers — see RELEASING.md.)
    exclude("**/*.bbmodel")             // BlockBench project files
    exclude("**/*.bak")                 // editor/backup leftovers
    exclude("**/*.orig")
    exclude("**/*.rej")
    exclude("**/*.psd")
    exclude("**/*.xcf")                 // GIMP project files
    exclude("**/*.kra")                 // Krita project files
    exclude("**/Thumbs.db")
    exclude("**/.DS_Store")
    exclude("**/desktop.ini")
    exclude("src/generated/**/.cache")  // datagen cache files
}

repositories {
    // Additional repositories for dependencies used by this mod.
    maven { url = 'https://maven.createmod.net' }          // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
    maven { url = 'https://maven.blamejared.com' }         // JEI
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://neoforged.forgecdn.net/releases' }        // NeoForge CDN fallback
    maven { url = 'https://neoforged.forgecdn.net/mojang-meta' }     // Mojang metadata proxy
    maven { url = 'https://libraries.minecraft.net/' }               // Mojang libraries
    maven { url = 'https://maven.aliyun.com/repository/public/' }    // CN mirror for Central content
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
        // Headless QA self-test, then the server halts itself. The property must reach the
        // GAME JVM, which a plain `-D` on the Gradle command line does not do:
        //   gradlew runServer -PselfTest
        if (project.hasProperty('selfTest')) {
            systemProperty 'create_productionline.selfTest', 'true'
        }
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The NeoForge userdev dependency (Minecraft + NeoForge).
    implementation "net.neoforged:neoforge:${neo_version}"

    // --- Create 6.0.10 (compile-time, "slim" dev jar without bundled deps; see official Create wiki) ---
    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") {
        transitive = false
    }
    // Ponder + Flywheel API (types referenced by Create's public API / needed to run the game)
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    // Registrate is bundled inside Create's release jars; with the "slim" dev jar it must be declared.
    implementation "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // Mixin annotations for @Accessor accessors (runtime mixin is provided by NeoForge).
    compileOnly "org.spongepowered:mixin:0.8.5"

    // --- JEI 19.x API (compile only; full jar at runtime) ---
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"

    // --- Runtime (development game runs only, not published) ---
    // NOTE: the runtime uses the "slim" Create dev jar (also our compile dep). The
    // full release jar pulls heavy optional mod dependencies in its POM, which we
    // deliberately avoid; the real Create release jar is what end users install.
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_display_url        : mod_display_url,
            mod_issue_tracker_url  : mod_issue_tracker_url,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// =============================================================================
// Publication to Modrinth + CurseForge (OPT-IN)
// -----------------------------------------------------------------------------
// Nothing below is evaluated unless you pass -PpublishMods, so ordinary builds and
// CI are unaffected. See RELEASING.md for the full walkthrough.
//
//   gradlew -PpublishMods publishModrinth
//   gradlew -PpublishMods publishCurseForge
//
// Credentials are read from the environment first (preferred, keeps them out of
// your shell history and out of the repository), then from ~/.gradle/gradle.properties:
//   MODRINTH_TOKEN     / modrinth_token
//   CURSEFORGE_TOKEN   / curseforge_token
// Project ids come from gradle.properties (modrinth_project_id / curseforge_project_id).
// =============================================================================
if (project.hasProperty('publishMods')) {
    apply plugin: 'com.modrinth.minotaur'
    apply plugin: 'net.darkhax.curseforgegradle'

    def changelogFile = file('CHANGELOG.md')
    def releaseNotes = changelogFile.exists() ? changelogFile.getText('UTF-8') : "Release ${project.version}"
    // A dev build is a beta by definition; only a release version may go out as `release`.
    def releaseType = project.findProperty('releaseType') ?: (devBuild ? 'beta' : 'release')
    if (version.toString().contains('-dev.') && releaseType == 'release') {
        throw new GradleException("Dev version ${version} cannot be published as 'release' — use beta/alpha, or bump mod_version.")
    }
    def supportedMc = ['1.21.1']
    def supportedLoaders = ['neoforge']
    def modrinthToken = System.getenv('MODRINTH_TOKEN') ?: project.findProperty('modrinth_token')
    def curseforgeToken = System.getenv('CURSEFORGE_TOKEN') ?: project.findProperty('curseforge_token')

    // --- Modrinth -------------------------------------------------------------
    // Validation happens at task-execution time so that merely configuring the build
    // (e.g. `-PpublishMods tasks`) never fails.
    modrinth {
        token = modrinthToken ?: ''
        projectId = project.modrinth_project_id?.trim() ?: ''
        versionNumber = project.version.toString()
        versionName = "v${project.version}"
        versionType = releaseType
        uploadFile = tasks.named('jar').get().archiveFile
        gameVersions = supportedMc
        loaders = supportedLoaders
        changelog = releaseNotes
        // Modrinth's environment/featured flags live on the project page.
        detectLoaders = false
        // `gradlew -PpublishMods modrinthSyncBody` pushes docs/platform-listing.md as the
        // project description (same text is used verbatim for CurseForge — see RELEASING.md).
        // Minotaur expects the body TEXT here, not a File.
        syncBodyFrom = rootProject.file('docs/platform-listing.md').getText('UTF-8')
        // The mod hard-depends on Create; declaring it lets Modrinth surface that.
        dependencies {
            required.project 'create'
        }
    }

    tasks.matching { it.name == 'modrinth' || it.name == 'publishModrinth' }.configureEach {
        doFirst {
            if (!project.modrinth_project_id?.trim()) {
                throw new GradleException("modrinth_project_id is empty — set it in gradle.properties (see RELEASING.md).")
            }
            if (!modrinthToken) {
                throw new GradleException("No Modrinth token found — set the MODRINTH_TOKEN environment variable.")
            }
        }
    }

    // --- CurseForge -----------------------------------------------------------
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = 'publishing'
        description = 'Uploads the built jar to CurseForge (requires -PpublishMods and CURSEFORGE_TOKEN).'
        apiToken = curseforgeToken ?: ''
        dependsOn tasks.named('jar')

        // CurseForgeGradle parses the project id as a number, so an unset id would make
        // task *configuration* fail. Only wire the upload when an id is actually present;
        // otherwise the task still exists and reports a clear error when executed.
        def cfProjectId = project.curseforge_project_id?.trim()
        if (cfProjectId) {
            def mainFile = upload(cfProjectId, tasks.named('jar').get().archiveFile.get().asFile)
            mainFile.releaseType = releaseType // release | beta | alpha
            mainFile.changelog = releaseNotes
            mainFile.changelogType = 'markdown'
            // CurseForge wants MC version, loader and Java version as game versions.
            mainFile.gameVersions.addAll('1.21.1', 'NeoForge', 'Java 21')
            mainFile.addRequirement('create')
            mainFile.displayName = "${project.mod_name} ${project.version}"
        }

        doFirst {
            if (!cfProjectId) {
                throw new GradleException("curseforge_project_id is empty — set it in gradle.properties (see RELEASING.md).")
            }
            if (!curseforgeToken) {
                throw new GradleException("No CurseForge token found — set the CURSEFORGE_TOKEN environment variable.")
            }
        }
    }
}
