name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository is authored on Windows, where the executable bit is not tracked,
      # so the wrapper has to be made runnable explicitly.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A dev tag (v0.0.0-dev.N) rebuilds that exact numbered artifact; a release tag
      # (v1.0.x) builds mod_version from gradle.properties. See RELEASING.md.
      - name: Resolve version arguments
        id: ver
        if: startsWith(github.ref, 'refs/tags/v0.0.0-dev.')
        run: echo "gradleArgs=-PdevBuildNumber=${GITHUB_REF_NAME#v0.0.0-dev.}" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build --stacktrace ${{ steps.ver.outputs.gradleArgs }}

      - name: Report jar contents and check hygiene
        run: |
          # -t: this job can see jars from an earlier run in a reused workspace; the
          # freshest one is the artifact this run produced.
          JAR=$(ls -t build/libs/*.jar | head -n 1)
          echo "### Built $(basename "$JAR")" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c%s "$JAR") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $(sha256sum "$JAR" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          # Publication hygiene: the jar must not contain editor leftovers.
          if unzip -l "$JAR" | grep -Eq '\.bak$|_particle|(^|/)debug/'; then
            echo "::error::jar contains development leftovers (.bak / *_particle.png / debug/)"
            unzip -l "$JAR" | grep -E '\.bak$|_particle|(^|/)debug/' || true
            exit 1
          fi
          echo "Jar hygiene OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: create_productionline-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Attach jar to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The changelog step below reads CHANGELOG.md, so this job needs the sources —
      # downloading the artifact alone is not enough.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: create_productionline-jar
          path: dist

      # The tag and the jar must agree: v1.0.1 -> create_productionline-1.0.1.jar,
      # v0.0.0-dev.5 -> create_productionline-0.0.0-dev.5.jar.
      - name: Verify the jar matches the tag
        run: |
          EXPECTED="create_productionline-${GITHUB_REF_NAME#v}.jar"
          if [ ! -f "dist/$EXPECTED" ]; then
            echo "::error::tag $GITHUB_REF_NAME expects $EXPECTED"
            ls -l dist
            exit 1
          fi
          echo "Tag and jar agree: $EXPECTED"

      # The release page should carry what actually changed, not only the compare link:
      # take the CHANGELOG section whose heading is this tag's version. Release headings
      # are `## [1.0.1] — date`, dev headings `## 0.0.0-dev.5 — date (beta)`.
      - name: Extract the changelog section for this tag
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^##\s*\[?{re.escape(version)}\]?(?![\d.])[^\n]*\n", text, re.M)
          body = ""
          if match:
              rest = text[match.end():]
              nxt = re.search(r"^##\s", rest, re.M)
              body = (rest[: nxt.start()] if nxt else rest).strip()
          if not body:
              body = f"Release {version} — see CHANGELOG.md."
          body += f"\n\n**Full Changelog**: https://github.com/{os.environ['GITHUB_REPOSITORY']}/commits/{tag}\n"
          pathlib.Path("release-body.md").write_text(body, encoding="utf-8")
          print(f"release body for {version}: {len(body)} chars")
          PY

      # `gh` instead of a third-party action: the title, the notes and the pre-release
      # flag are applied explicitly, and the step prints the result it produced.
      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Create: Production Line $GITHUB_REF_NAME"
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-dev.*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # --draft=false on purpose: a release can end up as a draft (e.g. left behind
            # when its tag was re-cut) and a draft is invisible to everyone but the owner.
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file release-body.md --draft=false $PRERELEASE
            gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" dist/*.jar --title "$TITLE" \
              --notes-file release-body.md --verify-tag $PRERELEASE
          fi
          gh release view "$GITHUB_REF_NAME" \
            --json tagName,name,isPrerelease,isDraft,url,assets \
            --jq '{tag:.tagName,title:.name,prerelease:.isPrerelease,draft:.isDraft,url:.url,assets:[.assets[]|{name,size}]}'
